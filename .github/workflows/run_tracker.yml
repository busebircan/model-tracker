name: Run Model Tracker

on:
  schedule:
    # Run every 3 hours to keep "most recent" panel fresh
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no files written)"
        required: false
        default: "false"
        type: boolean
      days:
        description: "Override lookback window (days)"
        required: false
        default: ""
        type: string

concurrency:
  group: model-tracker-commits
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  track-models:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit digest files, state, and dashboard data
      pages: write      # needed for GitHub Pages configuration
      id-token: write   # needed for GitHub Pages deployment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Model Tracker
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.days }}" ]; then
            ARGS="$ARGS --days ${{ github.event.inputs.days }}"
          fi
          python src/runner.py $ARGS

      - name: Generate dashboard data
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python src/dashboard_data.py

      - name: Prune stale dated digest files
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          # Delete YYYY-MM-DD-*.{json,md} files whose date is older than today-2 days.
          # The dashboard reads rolling latest-*.json files, so dated files only linger
          # from before the rolling-filename migration; today-2 keeps a small safety buffer.
          cutoff=$(date -u -d '2 days ago' +%Y-%m-%d)
          shopt -s nullglob
          for f in digests/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-*.json digests/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-*.md; do
            fdate=$(basename "$f" | cut -c1-10)
            if [[ "$fdate" < "$cutoff" ]]; then
              echo "Removing stale digest: $f (date $fdate < cutoff $cutoff)"
              rm "$f"
            fi
          done

      - name: Commit and push digests, state, and dashboard data
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "model-tracker-bot"
          git config user.email "bot@model-tracker"
          git add digests/ state/ docs/data/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: digest + dashboard update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
