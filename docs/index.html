<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Model Radar</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    /* ── Reset & base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --surface2: #21262d;
      --border:   #30363d;
      --accent:   #58a6ff;
      --accent2:  #3fb950;
      --warn:     #d29922;
      --danger:   #f85149;
      --text:     #e6edf3;
      --text-dim: #8b949e;
      --radius:   8px;
      --shadow:   0 2px 12px rgba(0,0,0,.4);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Header ───────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(6px);
    }

    .header-left { display: flex; align-items: center; gap: 12px; }

    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -.3px;
      color: var(--text);
    }

    .header-meta {
      font-size: 0.78rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .pulse {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent2);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .4; }
    }

    /* ── Layout ───────────────────────────────────────────── */
    .layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: calc(100vh - 73px);
    }

    /* ── Sidebar / tab nav ────────────────────────────────── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 0;
      position: sticky;
      top: 73px;
      height: calc(100vh - 73px);
      overflow-y: auto;
    }

    .sidebar-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 0 20px 8px;
    }

    .tab-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 20px;
      background: none;
      border: none;
      border-left: 3px solid transparent;
      color: var(--text-dim);
      font-size: 0.875rem;
      text-align: left;
      cursor: pointer;
      transition: all .15s;
      gap: 8px;
    }

    .tab-btn:hover {
      background: var(--surface2);
      color: var(--text);
    }

    .tab-btn.active {
      border-left-color: var(--accent);
      background: var(--surface2);
      color: var(--text);
      font-weight: 600;
    }

    .tab-badge {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1px 8px;
      font-size: 0.72rem;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .tab-btn.active .tab-badge {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ── Main content ─────────────────────────────────────── */
    main {
      padding: 32px;
      overflow-y: auto;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .profile-header {
      margin-bottom: 28px;
    }

    .profile-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .profile-desc {
      color: var(--text-dim);
      font-size: 0.9rem;
      max-width: 680px;
    }

    /* ── Stats row ────────────────────────────────────────── */
    .stats-row {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      min-width: 140px;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      color: var(--accent);
    }

    .stat-label {
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-top: 4px;
    }

    /* ── Model grid ───────────────────────────────────────── */
    .models-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }

    /* ── Model card ───────────────────────────────────────── */
    .model-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: border-color .2s;
    }

    .model-card:hover {
      border-color: var(--accent);
    }

    .model-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .model-name {
      font-size: 0.9rem;
      font-weight: 600;
      word-break: break-word;
    }

    .model-name a {
      color: var(--accent);
      text-decoration: none;
    }

    .model-name a:hover { text-decoration: underline; }

    .model-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .meta-item { display: flex; align-items: center; gap: 4px; }

    /* ── Badges ───────────────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: .02em;
      white-space: nowrap;
    }

    .badge-commercial { background: rgba(63,185,80,.15); color: var(--accent2); border: 1px solid rgba(63,185,80,.3); }
    .badge-nc         { background: rgba(210,153,34,.15); color: var(--warn);    border: 1px solid rgba(210,153,34,.3); }
    .badge-unknown    { background: var(--surface2);      color: var(--text-dim); border: 1px solid var(--border); }
    .badge-task       { background: rgba(88,166,255,.12); color: var(--accent);   border: 1px solid rgba(88,166,255,.25); }

    /* ── Tags / reasons ───────────────────────────────────── */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    .reason-tag {
      background: rgba(88,166,255,.08);
      border: 1px solid rgba(88,166,255,.2);
      color: var(--accent);
      font-size: 0.68rem;
      border-radius: 4px;
      padding: 2px 7px;
    }

    /* ── Benchmark chart ──────────────────────────────────── */
    .bench-section {
      background: var(--surface2);
      border-radius: 6px;
      padding: 12px;
    }

    .bench-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 8px;
    }

    .bench-chart-wrap {
      position: relative;
      height: 140px;
    }

    /* ── Page switcher (segmented control) ───────────────── */
    .page-switcher {
      display: flex;
      margin: 0 16px 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px;
    }

    .page-btn {
      flex: 1;
      padding: 6px 8px;
      background: none;
      border: none;
      border-radius: 4px;
      color: var(--text-dim);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, color .15s;
      text-align: center;
      letter-spacing: .01em;
    }

    .page-btn:hover {
      color: var(--text);
    }

    .page-btn.active {
      background: var(--surface2);
      color: var(--text);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0,0,0,.25);
    }

    /* ── Empty state ──────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-dim);
    }

    .empty-icon { font-size: 3rem; margin-bottom: 16px; }
    .empty-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; color: var(--text); }

    /* ── Footer ───────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 20px 32px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-top: 40px;
    }

    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── Loading overlay ──────────────────────────────────── */
    #loading {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      flex-direction: column;
      gap: 16px;
    }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ───────────────────────────────────────── */
    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }

      .sidebar {
        position: static;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 12px 0;
        overflow-x: auto;
        white-space: nowrap;
      }

      .sidebar-label { display: none; }

      .tab-btn {
        display: inline-flex;
        width: auto;
        border-left: none;
        border-bottom: 3px solid transparent;
        padding: 8px 16px;
      }

      .tab-btn.active {
        border-left-color: transparent;
        border-bottom-color: var(--accent);
      }

      main { padding: 20px 16px; }

      .models-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading">
  <div class="spinner"></div>
  <span style="color:var(--text-dim);font-size:.9rem">Loading model data…</span>
</div>

<!-- Header -->
<header>
  <div class="header-left">
    <div class="logo">🔭</div>
    <div>
      <h1>AI Model Radar</h1>
    </div>
  </div>
  <div class="header-meta">
    <span><span class="pulse"></span> Live</span>
    <span id="updated-label">—</span>
    <a href="https://github.com/busebircan/model-tracker" target="_blank" rel="noopener"
       style="color:var(--text-dim);text-decoration:none;">
      ⭐ GitHub
    </a>
  </div>
</header>

<!-- Main layout -->
<div class="layout">
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-label">Use Cases</div>
    <!-- tabs injected by JS -->
  </nav>

  <!-- Content -->
  <main id="main-content">
    <!-- panels injected by JS -->
  </main>
</div>

<footer>
  Generated by <a href="https://github.com/busebircan/model-tracker">model-tracker</a> ·
  Data refreshed daily at 07:00 UTC ·
  <span id="footer-updated"></span>
</footer>

<script>
/* ═══════════════════════════════════════════════════════════════
   AI Model Radar — dashboard script
   Reads: ./data/latest.json
   ═══════════════════════════════════════════════════════════════ */

const DATA_URL = './data/latest.json';

// ── Helpers ──────────────────────────────────────────────────────

function fmtDate(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' });
  } catch { return iso; }
}

function fmtNum(n) {
  if (!n) return '0';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
  return String(n);
}

function escapHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function licenseBadge(lic) {
  if (!lic || lic === 'unknown') return `<span class="badge badge-unknown">unknown</span>`;
  const nc = ['cc-by-nc', 'gpl', 'agpl', 'llama2', 'other-non-commercial'];
  const isNc = nc.some(x => lic.toLowerCase().includes(x));
  if (isNc) return `<span class="badge badge-nc">${escapHtml(lic)}</span>`;
  return `<span class="badge badge-commercial">${escapHtml(lic)}</span>`;
}

// ── Chart registry (to destroy before re-render) ─────────────────
const chartRegistry = {};

function renderBenchChart(canvasId, scores) {
  const BENCH_KEYS = ['arc', 'hellaswag', 'mmlu', 'truthfulqa', 'gsm8k', 'ifeval', 'bbh'];
  const LABEL_MAP = {
    arc: 'ARC', hellaswag: 'HellaSwag', mmlu: 'MMLU',
    truthfulqa: 'TruthfulQA', gsm8k: 'GSM8K', ifeval: 'IFEval', bbh: 'BBH',
    mteb_avg: 'MTEB Avg',
  };

  const labels = [];
  const values = [];

  for (const k of BENCH_KEYS) {
    if (scores[k] != null) {
      labels.push(LABEL_MAP[k] || k);
      values.push(scores[k]);
    }
  }
  if (scores.mteb_avg != null) {
    labels.push('MTEB Avg');
    values.push(scores.mteb_avg);
  }

  if (labels.length === 0) return false;

  const canvas = document.getElementById(canvasId);
  if (!canvas) return false;

  if (chartRegistry[canvasId]) {
    chartRegistry[canvasId].destroy();
  }

  chartRegistry[canvasId] = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Score (%)',
        data: values,
        backgroundColor: 'rgba(88,166,255,0.7)',
        borderColor: 'rgba(88,166,255,1)',
        borderWidth: 1,
        borderRadius: 4,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.parsed.y.toFixed(1)}%`
          }
        }
      },
      scales: {
        y: {
          beginAtZero: false,
          min: Math.max(0, Math.min(...values) - 10),
          max: 100,
          ticks: {
            color: '#8b949e',
            font: { size: 10 },
            callback: v => v + '%'
          },
          grid: { color: 'rgba(48,54,61,0.8)' }
        },
        x: {
          ticks: { color: '#8b949e', font: { size: 10 } },
          grid: { display: false }
        }
      }
    }
  });
  return true;
}

// ── Model card renderer ──────────────────────────────────────────

function renderModelCard(model, index, profileId) {
  const chartId = `chart-${profileId}-${index}`;
  const scores = model.benchmark_scores || {};
  const hasBench = Object.keys(scores).some(k => !['vs_references'].includes(k) && scores[k] != null);

  const tags = (model.tags || []).slice(0, 8).map(t =>
    `<span class="tag">${escapHtml(t)}</span>`
  ).join('');

  const reasons = (model.match_reasons || []).map(r =>
    `<span class="reason-tag">✓ ${escapHtml(r)}</span>`
  ).join('');

  const benchHtml = hasBench ? `
    <div class="bench-section">
      <div class="bench-title">📊 Benchmark Scores</div>
      <div class="bench-chart-wrap">
        <canvas id="${chartId}"></canvas>
      </div>
    </div>` : '';

  return `
    <article class="model-card" data-chart-id="${chartId}" data-profile="${profileId}" data-index="${index}">
      <div class="model-card-head">
        <div class="model-name">
          <a href="${escapHtml(model.url)}" target="_blank" rel="noopener">${escapHtml(model.id || model.name)}</a>
        </div>
        ${licenseBadge(model.license)}
      </div>

      <div class="model-meta">
        <span class="meta-item">
          <span class="badge badge-task">${escapHtml(model.task)}</span>
        </span>
        <span class="meta-item">📅 ${fmtDate(model.published_date)}</span>
        <span class="meta-item">⬇️ ${fmtNum(model.downloads)}</span>
        ${model.params_billions ? `<span class="meta-item">🔢 ${model.params_billions}B</span>` : ''}
      </div>

      ${tags ? `<div class="tags">${tags}</div>` : ''}
      ${reasons ? `<div class="tags">${reasons}</div>` : ''}
      ${benchHtml}
    </article>`;
}

// ── View state ───────────────────────────────────────────────────
let currentPage = 'recent';     // 'recent' | 'popular'
let currentProfile = null;      // profile id

function getProfileModels(profile, kind) {
  if (!profile) return [];
  return (kind === 'popular' ? profile.popular_models : profile.models) || [];
}

// ── Profile tab panel renderer ────────────────────────────────────

function renderProfilePanel(profileId, profile, kind) {
  const isPopular = kind === 'popular';
  const models = getProfileModels(profile, kind);
  const runAt = profile.run_at ? `Last run: ${fmtDate(profile.run_at)}` : '';

  let modelsHtml;
  if (models.length === 0) {
    const msg = isPopular
      ? 'No popular models match this profile.'
      : 'No new models in the last 24 hours.';
    modelsHtml = `
      <div class="empty-state">
        <div class="empty-icon">${isPopular ? '⭐' : '🔍'}</div>
        <div class="empty-title">${msg}</div>
      </div>`;
  } else {
    modelsHtml = `<div class="models-grid">
      ${models.map((m, i) => renderModelCard(m, i, `${kind}-${profileId}`)).join('\n')}
    </div>`;
  }

  let statsHtml;
  if (isPopular) {
    const topDownloads = models.length > 0 ? Math.max(...models.map(m => m.downloads || 0)) : 0;
    statsHtml = `
      <div class="stat-card">
        <div class="stat-value">${models.length}</div>
        <div class="stat-label">Popular models</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${fmtNum(topDownloads)}</div>
        <div class="stat-label">Top downloads</div>
      </div>`;
  } else {
    statsHtml = `
      <div class="stat-card">
        <div class="stat-value">${models.length}</div>
        <div class="stat-label">Last 24 hours</div>
      </div>
      ${runAt ? `<div class="stat-card">
        <div class="stat-value" style="font-size:1rem">${runAt}</div>
        <div class="stat-label">Last updated</div>
      </div>` : ''}`;
  }

  return `
    <div id="panel-${kind}-${profileId}" class="tab-panel">
      <div class="profile-header">
        <div class="profile-title">${escapHtml(profile.display_name)}</div>
        <div class="profile-desc">${escapHtml(profile.description || '')}</div>
      </div>
      <div class="stats-row">${statsHtml}</div>
      ${modelsHtml}
    </div>`;
}

// ── Panel + chart activation ─────────────────────────────────────

function showActivePanel() {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  if (!currentProfile) return;

  const target = document.getElementById(`panel-${currentPage}-${currentProfile}`);
  if (!target) return;
  target.classList.add('active');

  const profile = window._radarData?.profiles?.[currentProfile];
  const models = getProfileModels(profile, currentPage);

  target.querySelectorAll('[data-chart-id]').forEach(card => {
    const chartId = card.dataset.chartId;
    if (chartRegistry[chartId]) return;
    const idx = parseInt(card.dataset.index, 10);
    if (models[idx]) {
      renderBenchChart(chartId, models[idx].benchmark_scores || {});
    }
  });
}

function updateTabBadges() {
  const profiles = window._radarData?.profiles || {};
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const pid = btn.dataset.profile;
    const count = getProfileModels(profiles[pid], currentPage).length;
    const badge = btn.querySelector('.tab-badge');
    if (badge) badge.textContent = count;
  });
}

// ── Page switching ────────────────────────────────────────────────

function activatePage(page) {
  currentPage = page;
  document.querySelectorAll('.page-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.page === page);
  });
  updateTabBadges();
  showActivePanel();
}

// ── Tab switching ─────────────────────────────────────────────────

function activateTab(profileId) {
  currentProfile = profileId;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.profile === profileId);
  });
  showActivePanel();
}

// ── Main bootstrap ────────────────────────────────────────────────

async function init() {
  let data;
  try {
    const resp = await fetch(DATA_URL);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    data = await resp.json();
  } catch (err) {
    document.getElementById('loading').innerHTML = `
      <div style="text-align:center;color:var(--text-dim);padding:40px">
        <div style="font-size:2rem;margin-bottom:12px">⚠️</div>
        <div style="color:var(--text);font-size:1.1rem;margin-bottom:8px">No data yet</div>
        <p>Run the tracker to generate <code>docs/data/latest.json</code>.</p>
        <p style="margin-top:8px;font-size:.8rem">Error: ${err.message}</p>
      </div>`;
    return;
  }

  // Cache for chart re-renders
  window._radarData = data;

  // Update timestamps
  const genAt = data.generated_at;
  if (genAt) {
    const d = fmtDate(genAt);
    document.getElementById('updated-label').textContent = `Updated ${d}`;
    document.getElementById('footer-updated').textContent = `Data as of ${d}`;
  }

  // Build sidebar & panels
  const sidebar = document.getElementById('sidebar');
  const mainEl = document.getElementById('main-content');
  const profiles = data.profiles || {};
  const profileIds = Object.keys(profiles);

  if (profileIds.length === 0) {
    mainEl.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📭</div>
      <div class="empty-title">No profiles configured</div>
    </div>`;
    document.getElementById('loading').style.display = 'none';
    return;
  }

  // Render sidebar
  sidebar.innerHTML =
    `<div class="page-switcher">
      <button class="page-btn active" data-page="recent" onclick="activatePage('recent')">Most Recent</button>
      <button class="page-btn" data-page="popular" onclick="activatePage('popular')">Most Popular</button>
    </div>
    <div class="sidebar-label">Use Cases</div>` +
    profileIds.map(id => {
      const p = profiles[id];
      const count = (p.models || []).length;
      return `<button class="tab-btn" data-profile="${id}" onclick="activateTab('${id}')">
        <span>${escapHtml(p.display_name)}</span>
        <span class="tab-badge">${count}</span>
      </button>`;
    }).join('');

  // Render two panels per profile (recent + popular)
  mainEl.innerHTML = profileIds.map(id => {
    const profile = profiles[id];
    return renderProfilePanel(id, profile, 'recent')
         + renderProfilePanel(id, profile, 'popular');
  }).join('');

  // Activate initial state
  currentPage = 'recent';
  currentProfile = profileIds[0];
  document.querySelector(`.tab-btn[data-profile="${profileIds[0]}"]`)?.classList.add('active');
  showActivePanel();

  // Hide loading
  document.getElementById('loading').style.display = 'none';
}

// Kick off
init();
</script>
</body>
</html>
